<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnFlow — Interactive Learning + Clickstream Analytics</title>
  <meta name="description" content="An interactive learning platform that tracks every learner interaction as clickstream data." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Top navigation (hidden until logged in) -->
  <header id="topbar" class="topbar hidden">
    <a href="#/dashboard" class="brand" data-track-label="brand-home">
      <span class="brand-logo">🎓</span> LearnFlow
    </a>
    <nav class="nav">
      <a href="#/dashboard" data-nav="dashboard">Courses</a>
      <a href="#/analytics" data-nav="analytics">My Analytics</a>
    </nav>
    <div class="topbar-right">
      <span id="studyTimer" class="study-timer" title="Time in this learning session">
        <span class="timer-dot"></span>⏱ <span id="studyTimerVal">00:00</span>
      </span>
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      <span id="userChip" class="user-chip"></span>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Log out</button>
    </div>
  </header>

  <!-- Main app view — rendered by js/app.js -->
  <main id="app" class="app"></main>

  <!-- Toast container -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/tracker.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
